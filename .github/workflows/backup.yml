name: Nightly backup

# 00:30 IST — after the working day, before anybody starts.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

# A backup nobody has restored is a belief.
#
# Neon's history retention is a rollback, not a backup: on the Free plan it is
# twenty-four hours, it lives in the same account as the thing it protects, and
# it does not survive the failure that actually happens to small firms — a bad
# delete noticed six weeks later. So this takes a real dump every night.
#
# **It restores every dump it takes, immediately.** Not monthly, not on a
# separate schedule somebody forgets to look at: the restore runs in the same
# job, into a throwaway Postgres, and the job fails if the dump cannot be loaded
# or comes back missing rows. A backup verified once a month is a backup that
# was broken for up to a month.
#
# Works from day one with no AWS: the dump is kept as a workflow artifact.
# Setting AWS_ROLE_ARN and BACKUP_BUCKET switches it to S3, which is where it
# should end up — artifacts expire and are tied to the repository.

jobs:
  dump-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for AWS OIDC. Harmless when S3 is not configured.
      id-token: write

    services:
      # The restore target. Throwaway, and never reachable from anywhere.
      verify:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Match the client to the server
        # The runner ships an older client by default, and pg_dump refuses to
        # dump a server newer than itself. Neon is on 16.
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          pg_dump --version

      - name: Take the dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is not set"; exit 1; }
          mkdir -p backup
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Custom format: compressed, and restorable table-by-table when the
          # thing that went wrong is one table rather than the database.
          pg_dump --format=custom --no-owner --no-privileges \
            --file="backup/obizee-$STAMP.dump" "$DATABASE_URL"
          ls -lh backup/

      - name: Record what the dump should contain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Counted from the live database *before* the restore, so the comparison
        # below is against reality rather than against the dump's own opinion of
        # itself.
        run: |
          psql "$DATABASE_URL" -At -F',' -c "
            select relname, n_live_tup
              from pg_stat_user_tables
             where n_live_tup > 0
             order by relname" > backup/manifest.csv
          echo "tables with rows: $(wc -l < backup/manifest.csv)"

      - name: Restore it, and refuse to call it a backup until it loads
        env:
          PGPASSWORD: verify
        run: |
          pg_restore --no-owner --no-privileges \
            --dbname "postgresql://postgres:verify@localhost:5432/verify" \
            "backup/obizee-$STAMP.dump"

      - name: Compare the restored row counts to the live ones
        env:
          PGPASSWORD: verify
        run: |
          RESTORED="postgresql://postgres:verify@localhost:5432/verify"
          psql "$RESTORED" -c "analyze"
          FAILED=0
          while IFS=',' read -r table expected; do
            actual=$(psql "$RESTORED" -At -c "select count(*) from \"$table\"" 2>/dev/null || echo missing)
            # Live counts come from the statistics collector and are an estimate,
            # so this catches "the table did not come back" rather than a drift
            # of a few rows written while the dump was running.
            if [ "$actual" = "missing" ]; then
              echo "MISSING  $table (expected ~$expected)"; FAILED=1
            elif [ "$actual" = "0" ] && [ "$expected" != "0" ]; then
              echo "EMPTY    $table (expected ~$expected)"; FAILED=1
            else
              printf "ok       %-22s %s rows\n" "$table" "$actual"
            fi
          done < backup/manifest.csv
          exit $FAILED

      - name: Prove the schema is the one the code expects
        env:
          PGPASSWORD: verify
        # A dump that restores but has drifted from the migrations is a backup
        # you cannot deploy against. The runner refuses an edited migration, so
        # a clean pass here means the two agree.
        run: |
          psql "postgresql://postgres:verify@localhost:5432/verify" -At \
            -c "select count(*) from _applied_migrations" \
            | xargs -I{} sh -c 'echo "migrations in the backup: {}"; test {} -ge 12'

      - name: Keep it as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: obizee-backup-${{ env.STAMP }}
          path: backup/
          # GitHub's ceiling. S3 below is what keeps them longer than that.
          retention-days: 90

      # ---- Optional, and where these should really live -------------------
      # Artifacts expire and are tied to this repository. Set AWS_ROLE_ARN and
      # BACKUP_BUCKET and the dump also goes to S3, where versioning and object
      # lock can keep it beyond anybody's ability to delete it in a hurry.

      - name: AWS, if configured
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Upload to S3, if configured
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        run: |
          aws s3 cp "backup/obizee-$STAMP.dump" \
            "s3://${{ vars.BACKUP_BUCKET }}/neon/$(date -u +%Y/%m)/obizee-$STAMP.dump"
