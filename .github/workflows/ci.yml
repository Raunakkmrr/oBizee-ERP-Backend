name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# What this can prove, and what it cannot.
#
# The live tests — tenancy isolation, row-level security, the rate limiter, the
# numbering series — talk to a real database through Neon's HTTP driver, which
# speaks Neon's proxy rather than the Postgres wire protocol. A `postgres:16`
# service container is therefore not a stand-in for it, and pointing CI at the
# real database would have every push mutating the data the demos run against.
#
# So those tests skip here and say so: 77 of the 120 run, 43 skip. That is not
# the whole suite and this file does not pretend otherwise — the live ones run
# against a real database before a deploy, and `nfr-gates.ts` and the E2E suite
# are the other half.
#
# The connection strings below are deliberately unresolvable. The driver refuses
# to load without one at all, so CI has to provide something, and `db/live.ts`
# probes rather than trusting that a variable is set — which is what makes the
# skip honest instead of a crash.
#
# 77 in CI is still the difference between a broken push being caught in two
# minutes and being caught by a customer.

#
# Deploy target (2026-10-20): the platform surface runs as pm2 app `erp-api` on
# the oBizee API host behind https://business.obizee.com. The former Lambda
# pipeline (obizee-erp-platform / obizee-erp-tenant) is retired.

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches .nvmrc. Type stripping and --env-file both need 22.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Tests
        env:
          # Unresolvable on purpose. Everything that needs a real database
          # probes it and skips; nothing silently passes for lack of one.
          DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          APP_DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          JWT_SECRET: ci-only-not-a-real-secret-at-least-32-chars
          OTP_PROVIDER: dev
          OTP_DEV_MODE: "on"
          API_URL: http://ci.invalid
        # The skip count is printed, which is the point: a suite that quietly
        # skipped everything looks identical to a green one.
        run: pnpm exec vitest run

      - name: The platform server builds, boots and guards its routes
        # Catches what a type-check cannot: a dependency that will not bundle,
        # an ESM/CJS problem, or a process that dies before listening.
        env:
          DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          APP_DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          JWT_SECRET: ci-only-not-a-real-secret-at-least-32-chars
          ERP_PLATFORM_CONTROL_SECRET: ci-only-platform-secret-at-least-32-chars
          ERP_RELEASE: ${{ github.sha }}
          PORT: "8790"
        run: |
          set -euo pipefail
          pnpm run build:platform-server
          node dist/platform-server/index.mjs & pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8790/health && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8790/health | grep -q "\"release\":\"$ERP_RELEASE\""
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8790/platform/plans)" = 401

      - name: Retain the exact checked build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-server-${{ github.sha }}
          path: dist/platform-server/
          if-no-files-found: error
          retention-days: 90

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Raunakkmrr/oBizee-ERP-Backend'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits rather than racing the symlink.
    concurrency:
      group: erp-api-production
      cancel-in-progress: false
    env:
      RELEASE: ${{ github.sha }}
      ROOT: /home/ubuntu/erp-api

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: deploy

      - name: Download the build checked above
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: platform-server-${{ github.sha }}
          path: build

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.ERP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ERP_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload, switch, reload, verify
        env:
          TARGET: ${{ secrets.ERP_DEPLOY_USER }}@${{ secrets.ERP_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh_() { ssh -i ~/.ssh/deploy -o BatchMode=yes "$TARGET" "$@"; }
          ssh_ "mkdir -p $ROOT/releases/$RELEASE"
          scp -i ~/.ssh/deploy -o BatchMode=yes build/* deploy/ecosystem.config.cjs "$TARGET:$ROOT/releases/$RELEASE/"
          # The previous release stays on disk: rollback is re-pointing `current`.
          ssh_ "set -euo pipefail
            source ~/.nvm/nvm.sh >/dev/null
            cd $ROOT
            previous=\$(readlink current || true)
            ln -sfn releases/$RELEASE current.next && mv -T current.next current
            ERP_RELEASE=$RELEASE pm2 startOrReload current/ecosystem.config.cjs --update-env
            for i in \$(seq 1 20); do
              curl -fsS http://127.0.0.1:8790/health | grep -q '\"release\":\"$RELEASE\"' && ok=1 && break
              sleep 1
            done
            if [ -z \"\${ok:-}\" ]; then
              echo 'New release failed its health check; rolling back to' \"\$previous\"
              pm2 logs erp-api --lines 40 --nostream || true
              if [ -n \"\$previous\" ]; then
                ln -sfn \"\$previous\" current.next && mv -T current.next current
                ERP_RELEASE=\$(basename \"\$previous\") pm2 startOrReload current/ecosystem.config.cjs --update-env
              fi
              exit 1
            fi
            pm2 save
            # Keep the five newest releases.
            ls -1dt releases/* | tail -n +6 | xargs -r rm -rf"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://business.obizee.com/platform/plans)" = 401
          curl -fsS https://business.obizee.com/health | grep -q "\"release\":\"$RELEASE\""
