name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# What this can prove, and what it cannot.
#
# The live tests — tenancy isolation, row-level security, the rate limiter, the
# numbering series — talk to a real database through Neon's HTTP driver, which
# speaks Neon's proxy rather than the Postgres wire protocol. A `postgres:16`
# service container is therefore not a stand-in for it, and pointing CI at the
# real database would have every push mutating the data the demos run against.
#
# So those tests skip here and say so: 77 of the 120 run, 43 skip. That is not
# the whole suite and this file does not pretend otherwise — the live ones run
# against a real database before a deploy, and `nfr-gates.ts` and the E2E suite
# are the other half.
#
# The connection strings below are deliberately unresolvable. The driver refuses
# to load without one at all, so CI has to provide something, and `db/live.ts`
# probes rather than trusting that a variable is set — which is what makes the
# skip honest instead of a crash.
#
# 77 in CI is still the difference between a broken push being caught in two
# minutes and being caught by a customer.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Matches .nvmrc. Type stripping and --env-file both need 22.
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Tests
        env:
          # Unresolvable on purpose. Everything that needs a real database
          # probes it and skips; nothing silently passes for lack of one.
          DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          APP_DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          JWT_SECRET: ci-only-not-a-real-secret-at-least-32-chars
          OTP_PROVIDER: dev
          OTP_DEV_MODE: "on"
          API_URL: http://ci.invalid
        # The skip count is printed, which is the point: a suite that quietly
        # skipped everything looks identical to a green one.
        run: pnpm exec vitest run

      - name: The Lambda bundle builds and is importable
        # Catches the class of failure that only appears at deploy: a dependency
        # that cannot be bundled, or an ESM/CJS problem that a type-check has no
        # opinion about.
        env:
          DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          APP_DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          JWT_SECRET: ci-only-not-a-real-secret-at-least-32-chars
        run: |
          set -euo pipefail
          pnpm run build:lambda
          node --input-type=module -e "
            const m = await import('./dist/lambda/index.mjs');
            if (typeof m.handler !== 'function') throw new Error('no handler export');
            console.log('handler exports cleanly');
          "

          pnpm run build:platform-lambda
          node --input-type=module -e "
            const m = await import('./dist/platform-lambda/index.mjs');
            if (typeof m.handler !== 'function') throw new Error('no platform handler export');
            console.log('platform handler exports cleanly');
          "
          # Stable metadata permits byte-for-byte recovery with the same inputs.
          touch -t 198001010000 dist/platform-lambda/index.mjs dist/platform-lambda/package.json
          zip -X -j dist/platform-lambda.zip dist/platform-lambda/index.mjs dist/platform-lambda/package.json
          test "$(unzip -Z1 dist/platform-lambda.zip | sort)" = "$(printf 'index.mjs\npackage.json')"
          sha256sum dist/platform-lambda.zip > dist/platform-lambda.zip.sha256

      - name: Retain the exact checked platform archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: platform-lambda-${{ github.sha }}
          path: |
            dist/platform-lambda.zip
            dist/platform-lambda.zip.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 90
          compression-level: 0

      - name: Build, import, and package the isolated tenant authentication runtime
        env:
          DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          APP_DATABASE_URL: postgresql://ci:ci@ci.invalid/ci?sslmode=require
          JWT_SECRET: ci-only-not-a-real-secret-at-least-32-chars
        run: |
          set -euo pipefail
          pnpm run build:tenant-lambda
          node --input-type=module -e "
            const m = await import('./dist/tenant-lambda/index.mjs');
            if (typeof m.handler !== 'function') throw new Error('no tenant handler export');
          "
          touch -t 198001010000 dist/tenant-lambda/index.mjs dist/tenant-lambda/package.json
          zip -X -j dist/tenant-lambda.zip dist/tenant-lambda/index.mjs dist/tenant-lambda/package.json
          test "$(unzip -Z1 dist/tenant-lambda.zip | sort)" = "$(printf 'index.mjs\npackage.json')"
          sha256sum dist/tenant-lambda.zip > dist/tenant-lambda.zip.sha256

      - name: Retain the exact checked tenant archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tenant-lambda-${{ github.sha }}
          path: |
            dist/tenant-lambda.zip
            dist/tenant-lambda.zip.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 90
          compression-level: 0

  deploy-platform:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Raunakkmrr/oBizee-ERP-Backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: obizee-erp-platform-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-south-1
      AWS_PAGER: ""
      PLATFORM_FUNCTION_ARN: arn:aws:lambda:ap-south-1:940482448572:function:obizee-erp-platform
    steps:
      - name: Download the checked archive from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: platform-lambda-${{ github.sha }}
          path: dist

      - name: Verify archive and reject a stale main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check dist/platform-lambda.zip.sha256
          test "$(unzip -Z1 dist/platform-lambda.zip | sort)" = "$(printf 'index.mjs\npackage.json')"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$latest" = "$GITHUB_SHA" || { echo 'Refusing to deploy a superseded main commit'; exit 1; }

      - name: Assume the platform-only deployment role through OIDC
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: arn:aws:iam::940482448572:role/github-obizee-erp-platform-deploy
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          allowed-account-ids: "940482448572"
          role-duration-seconds: 900
          role-session-name: platform-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true

      - name: Update only the platform code and verify the deployed hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(aws lambda get-function-configuration --function-name "$PLATFORM_FUNCTION_ARN" \
            --query '{RevisionId:RevisionId,CodeSha256:CodeSha256,LastModified:LastModified,Runtime:Runtime,Handler:Handler,PackageType:PackageType,LastUpdateStatus:LastUpdateStatus}' --output json)
          printf '%s\n' "$before" > platform-before.json
          jq -e '.Runtime == "nodejs22.x" and .Handler == "index.handler" and .PackageType == "Zip" and .LastUpdateStatus == "Successful"' platform-before.json
          revision=$(jq -er '.RevisionId' platform-before.json)
          expected=$(openssl dgst -sha256 -binary dist/platform-lambda.zip | openssl base64 -A)
          # Recheck after OIDC/config/hash preparation, directly at the write gate.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$latest" = "$GITHUB_SHA" || { echo 'Refusing to deploy a superseded main commit at the write gate'; exit 1; }
          aws lambda update-function-code --function-name "$PLATFORM_FUNCTION_ARN" \
            --revision-id "$revision" --zip-file fileb://dist/platform-lambda.zip \
            --query '{RevisionId:RevisionId,CodeSha256:CodeSha256,LastModified:LastModified}' --output json > platform-update.json
          {
            printf 'Submitted platform commit: `%s`\n\n' "$GITHUB_SHA"
            printf '```json\n'; jq . platform-update.json; printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! latest_after=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'); then
            echo '::error::Platform update was submitted, but main could not be rechecked. Manual review required; no automatic rollback.'
            printf '\nMain recheck failed after the write. Manual review required; no automatic rollback.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if test "$latest_after" != "$GITHUB_SHA"; then
            echo '::error::Main advanced during the platform write. Manual review required; no automatic rollback.'
            printf '\nMain advanced during the write to `%s`. Manual review required; no automatic rollback.\n' "$latest_after" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # This waiter uses only GetFunctionConfiguration, matching the IAM policy.
          aws lambda wait function-updated --function-name "$PLATFORM_FUNCTION_ARN"
          aws lambda get-function-configuration --function-name "$PLATFORM_FUNCTION_ARN" \
            --query '{RevisionId:RevisionId,CodeSha256:CodeSha256,LastModified:LastModified,LastUpdateStatus:LastUpdateStatus}' --output json > platform-after.json
          jq -e --arg expected "$expected" '.CodeSha256 == $expected and .LastUpdateStatus == "Successful"' platform-after.json
          {
            printf 'Platform commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Archive CodeSha256: `%s`\n\n' "$expected"
            printf '```json\n'; jq . platform-before.json platform-after.json; printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-tenant:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Raunakkmrr/oBizee-ERP-Backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: obizee-erp-tenant-production
      cancel-in-progress: false
    env:
      AWS_REGION: ap-south-1
      AWS_PAGER: ""
      TENANT_FUNCTION_ARN: arn:aws:lambda:ap-south-1:940482448572:function:obizee-erp-tenant
    steps:
      - name: Download the checked archive from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tenant-lambda-${{ github.sha }}
          path: dist

      - name: Verify archive and reject a stale main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum --check dist/tenant-lambda.zip.sha256
          test "$(unzip -Z1 dist/tenant-lambda.zip | sort)" = "$(printf 'index.mjs\npackage.json')"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$latest" = "$GITHUB_SHA" || { echo 'Refusing to deploy a superseded main commit'; exit 1; }

      - name: Assume the tenant-only deployment role through OIDC
        uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: arn:aws:iam::940482448572:role/github-obizee-erp-tenant-deploy
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          allowed-account-ids: "940482448572"
          role-duration-seconds: 900
          role-session-name: tenant-${{ github.run_id }}-${{ github.run_attempt }}
          unset-current-credentials: true

      - name: Update only the tenant code and verify the deployed hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          before=$(aws lambda get-function-configuration --function-name "$TENANT_FUNCTION_ARN" \
            --query '{RevisionId:RevisionId,CodeSha256:CodeSha256,LastModified:LastModified,Runtime:Runtime,Handler:Handler,PackageType:PackageType,LastUpdateStatus:LastUpdateStatus}' --output json)
          printf '%s\n' "$before" > tenant-before.json
          jq -e '.Runtime == "nodejs22.x" and .Handler == "index.handler" and .PackageType == "Zip" and .LastUpdateStatus == "Successful"' tenant-before.json
          revision=$(jq -er '.RevisionId' tenant-before.json)
          expected=$(openssl dgst -sha256 -binary dist/tenant-lambda.zip | openssl base64 -A)
          # Recheck after OIDC/config/hash preparation, directly at the write gate.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$latest" = "$GITHUB_SHA" || { echo 'Refusing to deploy a superseded main commit at the write gate'; exit 1; }
          aws lambda update-function-code --function-name "$TENANT_FUNCTION_ARN" \
            --revision-id "$revision" --zip-file fileb://dist/tenant-lambda.zip \
            --query '{RevisionId:RevisionId,CodeSha256:CodeSha256,LastModified:LastModified}' --output json > tenant-update.json
          {
            printf 'Submitted tenant commit: `%s`\n\n' "$GITHUB_SHA"
            printf '```json\n'; jq . tenant-update.json; printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! latest_after=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'); then
            echo '::error::Platform update was submitted, but main could not be rechecked. Manual review required; no automatic rollback.'
            printf '\nMain recheck failed after the write. Manual review required; no automatic rollback.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if test "$latest_after" != "$GITHUB_SHA"; then
            echo '::error::Main advanced during the tenant write. Manual review required; no automatic rollback.'
            printf '\nMain advanced during the write to `%s`. Manual review required; no automatic rollback.\n' "$latest_after" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # This waiter uses only GetFunctionConfiguration, matching the IAM policy.
          aws lambda wait function-updated --function-name "$TENANT_FUNCTION_ARN"
          aws lambda get-function-configuration --function-name "$TENANT_FUNCTION_ARN" \
            --query '{RevisionId:RevisionId,CodeSha256:CodeSha256,LastModified:LastModified,LastUpdateStatus:LastUpdateStatus}' --output json > tenant-after.json
          jq -e --arg expected "$expected" '.CodeSha256 == $expected and .LastUpdateStatus == "Successful"' tenant-after.json
          {
            printf 'Platform commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'Archive CodeSha256: `%s`\n\n' "$expected"
            printf '```json\n'; jq . tenant-before.json tenant-after.json; printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
